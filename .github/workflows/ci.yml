name: CI

on:
  push:
    branches: [ Fork, main, master ]
  pull_request:
    branches: [ Fork, main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./
        run: |
          python -m pip install --upgrade pip
          pip install -r horilla/requirements.txt

      - name: Run makemigrations check
        working-directory: ./horilla
        run: |
          # Fail the job if new model changes don't include migrations
          python manage.py makemigrations --check --dry-run

      - name: Run migrations against SQLite (sanity)
        working-directory: ./horilla
        run: |
          # Use a temporary sqlite DB in CI to ensure migrations run cleanly
          export DATABASE_URL="sqlite:///./ci_test_db.sqlite3"
          python manage.py migrate --noinput
